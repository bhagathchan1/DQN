# Single-player Pong (ALE/Pong-v5) pre-training with the Nature DQN settings.
# The agent controls the right paddle against the built-in computer opponent, matching
# the machine side of the two-player Pong Learning Lab. Same 6-action set and
# pillow 84x84 max2 stack4 preprocessing, so weights transfer to the lab.
run:
  id: pong_nature_seed7
  seed: 7
environment:
  id: ALE/Pong-v5
  noop_max: 30
training:
  device: auto
  network: nature
  total_environment_steps: 10000000
  learning_starts: 50000
  batch_size: 32
  gamma: 0.99
  learning_rate: 0.00025
  optimizer: nature_rmsprop
  gradient_clip: null
  train_frequency: 4
  target_update_frequency: 10000
  checkpoint_frequency: 500000
  checkpoint_keep: 3
  validation_frequency: 250000
  log_frequency: 25000
  epsilon_start: 1.0
  epsilon_end: 0.1
  epsilon_decay_steps: 1000000
  epsilon_after_warmup: true
  clip_rewards: true
replay:
  type: uniform
  storage: frames
  capacity: 1000000
  directory: replay
evaluation:
  episodes: 10
  epsilon: 0.05
  max_steps_per_episode: 27000
